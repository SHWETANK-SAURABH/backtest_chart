[project]
name = "nifty-backtester"
version = "0.1.0"
description = "NIFTY 50 intraday backtesting and strategy analytics platform"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "celery>=5.4,<6",
    "duckdb>=1.1,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "polars>=1.9,<2",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=17",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "redis>=5,<7",
    "sqlalchemy>=2.0.35,<3",
    "structlog>=24.4",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pgserver>=0.1.4",
    "pytest>=8.3,<9",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/0001_initial_schema.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.workers.*"
disallow_untyped_decorators = false
